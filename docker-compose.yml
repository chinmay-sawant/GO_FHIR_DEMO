version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fhir_postgres
    environment:
      POSTGRES_DB: fhir_demo
      POSTGRES_USER: fhir_user
      POSTGRES_PASSWORD: fhir_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fhir_user -d fhir_demo"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fhir-network

  consul:
    image: hashicorp/consul:1.21.0
    container_name: fhir_consul
    ports:
      - "8500:8500"
    command: "agent -server -bootstrap-expect 1 -client=0.0.0.0 -ui -data-dir=/consul/data"
    environment:
      CONSUL_BIND_INTERFACE: eth0
      CONSUL_DATA_DIR: /consul/data
    volumes:
      - consul_data:/consul/data
    networks:
      - fhir-network
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:latest
    container_name: fhir_vault
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: http://localhost:8200
    cap_add:
      - IPC_LOCK
    command: "server"
    networks:
      - fhir-network
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - vault_data:/vault/file
      - ./vault/config:/vault/config
      - ./vault/policies:/vault/policies
      - ./vault/data:/vault/data

  redis:
    image: redis:7-alpine
    container_name: go-fhir-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - fhir-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  jaeger:
    image: jaegertracing/all-in-one:1.70.0
    container_name: fhir_jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector HTTP
      - "14250:14250"  # Jaeger collector gRPC
      - "6831:6831/udp"    # Jaeger agent UDP
      - "6832:6832/udp"    # Jaeger agent UDP
      - "4318:4318"        # OTLP HTTP endpoint
    environment:
      COLLECTOR_OTLP_ENABLED: true
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    networks:
      - fhir-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 30s
      timeout: 10s
      retries: 3

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: fhir_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper
    networks:
      - fhir-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fhir_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://localhost:29092,PLAINTEXT_EXTERNAL://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:29092,PLAINTEXT_EXTERNAL://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - fhir-network

  fhir-api:
    build: .
    container_name: fhir_api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: fhir_user
      DB_PASSWORD: fhir_password
      DB_NAME: fhir_demo
      DB_SSLMODE: disable
      SERVER_PORT: 8080
      GIN_MODE: release
      LOG_LEVEL: info
      CONSUL_ADDRESS: http://consul:8500
      CONSUL_KEY: myapp/secret
      VAULT_ADDRESS: http://vault:8200
      VAULT_TOKEN: root
      VAULT_SECRET_PATH: secret/data/myapp
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
      JAEGER_SERVICE_NAME: go-fhir-demo
      JAEGER_ENVIRONMENT: docker
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: async-topic
      KAFKA_GROUP_ID: async-group
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_started
      vault:
        condition: service_started
      jaeger:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./logs:/root/logs
    networks:
      - fhir-network

volumes:
  postgres_data:
  consul_data:
  vault_data:
  redis_data:
  zookeeper_data:
  kafka_data:

networks:
  fhir-network:
    driver: bridge